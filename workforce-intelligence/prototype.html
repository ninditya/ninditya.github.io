document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

15, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201f1d;\n  --color-accent: #b68235;\n  --color-accent-2: #ac803e;\n  --color-divider: color-mix(in srgb, #201f1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff3e4;\n  --color-accent-200: #ffe3bf;\n  --color-accent-300: #facb8d;\n  --color-accent-400: #e1ad66;\n  --color-accent-500: #c28d41;\n  --color-accent-600: #a06f24;\n  --color-accent-700: #7d5411;\n  --color-accent-800: #5a3b0a;\n  --color-accent-900: #3a270d;\n\n  --color-accent-2-100: #fff3e4;\n  --color-accent-2-200: #ffe3be;\n  --color-accent-2-300: #f5cd96;\n  --color-accent-2-400: #dbaf70;\n  --color-accent-2-500: #bc8f4e;\n  --color-accent-2-600: #9b7232;\n  --color-accent-2-700: #79561f;\n  --color-accent-2-800: #573d14;\n  --color-accent-2-900: #382810;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n       <div style=\"height:1px;background:var(--color-accent);opacity:0.5;margin-bottom:var(--space-6)\"></div>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin-bottom:var(--space-8)\">\n          <sc-for list=\"{{ personStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid var(--color-divider);padding-top:var(--space-2)\">\n              <div style=\"font-family:var(--font-heading);font-size:24px;font-variant-numeric:tabular-nums;line-height:1\">{{ s.value }}</div>\n              <div class=\"text-muted\" style=\"font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;margin-top:4px\">{{ s.label }}</div>\n            </div>\n          </sc-for>\n        </div>\n\n        <h4 style=\"font-size:18px;margin-bottom:var(--space-3)\">Provenance skill</h4>\n        <sc-raw-table class=\"table\" style=\"margin-bottom:var(--space-8)\">\n          <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:240px\">Skill</sc-raw-th><sc-raw-th style=\"width:110px\">Status</sc-raw-th><sc-raw-th style=\"width:80px\">Confidence</sc-raw-th><sc-raw-th>Sumber</sc-raw-th></sc-raw-tr></sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ personSkills }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <sc-raw-tr>\n                <sc-raw-td>{{ s.name }}</sc-raw-td>\n                <sc-raw-td><span class=\"{{ s.badgeClass }}\">{{ s.status }}</span></sc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ s.conf }}</sc-raw-td>\n                <sc-raw-td class=\"text-muted\" style=\"font-size:12.5px\">{{ s.source }}</sc-raw-td>\n              </sc-raw-tr>\n            </sc-for>\n          </sc-raw-tbody>\n        </sc-raw-table>\n\n        <h4 style=\"font-size:18px;margin-bottom:var(--space-3)\">Jejak audit resolusi identitas</h4>\n        <sc-raw-table class=\"table\">\n          <sc-raw-tbody>\n            <sc-for list=\"{{ personAudit }}\" as=\"a\" hint-placeholder-count=\"6\">\n              <sc-raw-tr><sc-raw-td style=\"width:200px\" class=\"text-muted\">{{ a.k }}</sc-raw-td><sc-raw-td>{{ a.v }}</sc-raw-td></sc-raw-tr>\n            </sc-for>\n          </sc-raw-tbody>\n        </sc-raw-table>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{ isBranches }}\">\n      <div style=\"max-width:8.5in\">\n        <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700)\">Artefak Hari 30</div>\n        <h1 style=\"font-size:34px;font-weight:400;margin:var(--space-2) 0 var(--space-3)\">Cermin Data — Fill Rate Cabang</h1>\n        <p style=\"font-family:var(--font-heading);font-size:22px;line-height:1.4;margin:0 0 var(--space-4);max-width:6.5in\">{{ branchHeadline }}</p>\n        <div style=\"height:1px;background:var(--color-accent);opacity:0.5;margin-bottom:var(--space-6)\"></div>\n\n        <sc-raw-table class=\"table\">\n          <sc-raw-thead><sc-raw-tr>\n            <sc-raw-th style=\"width:150px\">Cabang</sc-raw-th><sc-raw-th style=\"width:100px\">Tier adopsi</sc-raw-th><sc-raw-th style=\"width:110px\">Skill terisi</sc-raw-th>\n            <sc-raw-th style=\"width:70px\">Fill rate</sc-raw-th><sc-raw-th>Sebaran</sc-raw-th>\n          </sc-raw-tr></sc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ branchRows }}\" as=\"b\" hint-placeholder-count=\"12\">\n              <sc-raw-tr>\n                <sc-raw-td><strong>{{ b.name }}</strong></sc-raw-td>\n                <sc-raw-td class=\"text-muted\">{{ b.tier }}</sc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ b.ratio }}</sc-raw-td>\n                <sc-raw-td style=\"font-variant-numeric:tabular-nums\">{{ b.rate }}</sc-raw-td>\n                <sc-raw-td>\n                  <div style=\"height:9px;border:1px solid var(--color-divider);border-radius:2px;position:relative;overflow:hidden;max-width:260px\">\n                    <div style=\"{{ b.barStyle }}\"></div>\n                  </div>\n                </sc-raw-td>\n              </sc-raw-tr>\n            </sc-for>\n          </sc-raw-tbody>\n        </sc-raw-table>\n\n        <p class=\"text-muted\" style=\"font-size:12.5px;line-height:1.65;margin-top:var(--space-6);max-width:6.2in\">Skill sebenarnya digenerate dari distribusi identik untuk seluruh cabang. Karena itu setiap perbedaan pada kolom ini adalah perbedaan pencatatan, bukan perbedaan tenaga kerja. Tidak ada model di layar ini, dan justru karena itu tidak ada yang bisa membantahnya.</p>\n      </div>\n    </sc-if>\n\n  </main>\n</div>\n\n<sc-if value=\"{{ toastVisible }}\">\n  <div class=\"toast\" role=\"status\" aria-live=\"polite\">{{ toastText }}</div>\n</sc-if>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CANON_BRANCH = [\"Jakarta Pusat\",\"Bekasi\",\"Bandung\",\"Surabaya\",\"Semarang\",\"Yogyakarta\",\"Medan\",\"Palembang\",\"Makassar\",\"Balikpapan\",\"Denpasar\",\"Manado\"];\nconst TIER = {\"Jakarta Pusat\":\"high\",\"Bekasi\":\"high\",\"Bandung\":\"high\",\"Surabaya\":\"mid\",\"Semarang\":\"mid\",\"Yogyakarta\":\"mid\",\"Medan\":\"mid\",\"Denpasar\":\"mid\",\"Palembang\":\"low\",\"Makassar\":\"low\",\"Balikpapan\":\"low\",\"Manado\":\"low\"};\nconst TIER_ID = {high:\"Tinggi\", mid:\"Menengah\", low:\"Rendah\"};\nconst REASON_LABEL = {\n  identity_probabilistic_or_orphan: \"Identitas probabilistik atau orphan\",\n  hire_date_conflict_within_hris: \"Konflik tanggal di dalam HRIS\",\n  status_conflict_possible_transfer: \"Konflik status, indikasi mutasi\",\n  skill_no_signal: \"Tidak ada sinyal skill\",\n  title_unmapped_or_fuzzy: \"Title tidak terpetakan\"\n};\nconst TIER_LABEL = {\n  T1_email: \"T1 email\", T1_nik: \"T1 NIK\", T2_name_dob: \"T2 nama+DOB\",\n  T3a_fuzzy_high: \"T3a fuzzy\", T3b_fuzzy_mid: \"T3b fuzzy\", T4_single_hris: \"T4 HRIS\", T4_orphan: \"T4 orphan\"\n};\nconst num = (n, d) => n.toFixed(d === undefined ? 2 : d).replace(\".\", \",\");\nconst splitList = (s) => (s || \"\").split(\";\").map(x => x.trim()).filter(Boolean);\nconst canonBranch = (b) => {\n  const t = (b || \"\").trim();\n  const hit = CANON_BRANCH.find(c => c.toLowerCase() === t.toLowerCase());\n  return hit || t;\n};\n\nclass Component extends DCLogic {\n  state = { loading: true, screen: \"queue\", ds: \"B\", person: null, trigger: null, from: \"queue\", reviewed: {}, toast: null };\n\n  componentDidMount() { this.load(); }\n\n  markReviewed(id, label) {\n    if (!id || this.state.reviewed[id]) return;\n    this.setState({ reviewed: { ...this.state.reviewed, [id]: true }, toast: (label || \"Record\") + \" ditandai selesai ditinjau.\" });\n    if (this._toastTimer) clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ toast: null }), 3200);\n  }\n\n  async load() {\n    if (window.__MEDIKA_DATA) {\n      this.raw = window.__MEDIKA_DATA;\n      this.compute();\n      this.setState({ loading: false });\n      return;\n    }\n    const base = \"data/\";\n    const [a, b, tax, auditTxt] = await Promise.all([\n      fetch(base + \"dataset_a_messy.json\").then(r => r.json()),\n      fetch(base + \"dataset_b_clean.json\").then(r => r.json()),\n      fetch(base + \"role_taxonomy.json\").then(r => r.json()),\n      fetch(base + \"resolution_audit.csv\").then(r => r.text())\n    ]);\n    const L = auditTxt.trim().split(\"\\n\");\n    const H = L[0].split(\",\");\n    const audit = L.slice(1).map(line => {\n      const c = []; let cur = \"\", q = false;\n      for (const ch of line) { if (ch === '\"') q = !q; else if (ch === \",\" && !q) { c.push(cur); cur = \"\"; } else cur += ch; }\n      c.push(cur);\n      const o = {}; H.forEach((h, i) => o[h.trim()] = (c[i] || \"\").trim()); return o;\n    });\n    this.raw = { a, b, tax, audit };\n    this.compute();\n    this.setState({ loading: false });\n  }\n\n  compute() {\n    const { a, b, tax, audit } = this.raw;\n    const emp = a.filter(r => r.source_system === \"HRIS_SuccessFactors\" && r.raw_job_title && !r.record_notes);\n\n    // ---- Dataset A: naive grouping on raw title strings ----\n    const ga = {};\n    emp.forEach(r => {\n      const br = canonBranch(r.branch);\n      const t = (r.raw_job_title || \"\").replace(/\\s+/g, \" \").trim().toLowerCase();\n      const k = br + \"|\" + t;\n      (ga[k] = ga[k] || { branch: br, title: t, n: 0, skills: 0 });\n      ga[k].n++; ga[k].skills += splitList(r.skills_raw).length;\n    });\n    this.groupsA = Object.values(ga).map(g => {\n      const avg = g.skills / g.n;\n      return { branch: g.branch, role: g.title, headcount: g.n, gap: 1 - Math.min(1, avg / 4), avgSkills: avg, key: g.branch + \"|\" + g.title };\n    }).filter(g => g.headcount >= 2).sort((x, y) => y.gap - x.gap || y.headcount - x.headcount);\n\n    // ---- Dataset B: canonical role groups with signal + coverage ----\n    const gb = {};\n    b.forEach(r => {\n      const br = canonBranch(r.branch);\n      if (!br) return;\n      const k = br + \"|\" + r.canonical_role_code;\n      (gb[k] = gb[k] || { branch: br, code: r.canonical_role_code, title: r.canonical_title, n: 0, cov: 0, req: 0, sig: 0, people: [] });\n      const g = gb[k];\n      g.n++; g.cov += (r.required_skill_covered || 0); g.req += (r.required_skill_count || 0);\n      if (splitList(r.skills_declared).length || splitList(r.skills_evidenced).length || splitList(r.skills_inferred).length) g.sig++;\n      g.people.push(r);\n    });\n    const allB = Object.values(gb).filter(g => g.n >= 2).map(g => {\n      const coverage = g.req ? g.cov / g.req : 0;\n      return { branch: g.branch, role: g.title, code: g.code, headcount: g.n, gap: 1 - coverage, coverage, signalRatio: g.sig / g.n, people: g.people, key: g.branch + \"|\" + g.code };\n    });\n    this.groupsB = allB.filter(g => g.signalRatio >= 0.5).sort((x, y) => y.gap - x.gap || y.headcount - x.headcount);\n    this.needsData = allB.filter(g => g.signalRatio < 0.5).sort((x, y) => x.signalRatio - y.signalRatio || y.headcount - x.headcount);\n\n    this.reqByCode = {};\n    Object.keys(tax.roles).forEach(c => this.reqByCode[c] = tax.roles[c].required_skills);\n    this.byId = {}; b.forEach(r => this.byId[r.person_id] = r);\n    this.auditById = {}; audit.forEach(r => this.auditById[r.person_id] = r);\n    this.flagged = b.filter(r => r.review_flag === \"Y\");\n\n    const rc = {};\n    this.flagged.forEach(r => splitList(r.review_reason).forEach(x => rc[x] = (rc[x] || 0) + 1));\n    this.reasonCounts = rc;\n\n    // branch fill rate from HRIS employment records\n    const bf = {};\n    emp.forEach(r => { const br = canonBranch(r.branch); if (!br) return; (bf[br] = bf[br] || { n: 0, f: 0 }); bf[br].n++; if (r.skills_raw) bf[br].f++; });\n    this.branches = Object.keys(bf).map(k => ({ name: k, n: bf[k].n, f: bf[k].f, rate: bf[k].f / bf[k].n })).sort((x, y) => y.rate - x.rate);\n\n    // top-5 overlap between A and B rankings\n    const topA = this.groupsA.slice(0, 5).map(g => g.branch);\n    const topB = this.groupsB.slice(0, 5).map(g => g.branch);\n    this.overlap = topA.filter(x => topB.includes(x)).length;\n    this.lowInTopA = this.groupsA.slice(0, 10).filter(g => TIER[g.branch] === \"low\").length;\n    this.lowInTopB = this.groupsB.slice(0, 10).filter(g => TIER[g.branch] === \"low\").length;\n  }\n\n  go(screen, from) { this.setState({ screen, person: null, from: from || screen }); }\n  openPerson(id) { this.setState({ from: this.state.screen, screen: \"person\", person: id }); }\n\n  actionFor(g) {\n    if (g.gap >= 0.85) return \"Rekrut atau mutasi internal\";\n    if (g.headcount >= 4) return \"Pelatihan kelompok Q4\";\n    return \"Pelatihan internal\";\n  }\n\n  renderVals() {\n    const s = this.state;\n    const navBase = \"display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:var(--space-2);padding:var(--space-1) var(--space-2);border:0;border-radius:var(--radius-md);background:transparent;font:inherit;font-size:13.5px;color:inherit;text-align:left;cursor:pointer\";\n    const navOn = navBase + \";box-shadow:inset 0 0 0 1px var(--color-accent);color:var(--color-accent-800)\";\n    const keyOpen = (fn) => (e) => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); fn(); } };\n\n    const v = {\n      loading: s.loading,\n      isQueue: !s.loading && s.screen === \"queue\",\n      isNeeds: !s.loading && s.screen === \"needs\" && s.ds === \"B\",\n      isReview: !s.loading && s.screen === \"review\" && s.ds === \"B\",\n      isAbsent: !s.loading && s.ds === \"A\" && (s.screen === \"needs\" || s.screen === \"review\"),\n      absentTitle: s.screen === \"review\" ? \"Antrean Review\" : \"Butuh Data\",\n      absentBody: s.screen === \"review\"\n        ? \"Dataset A tidak punya antrean review, karena tidak punya confidence. Union naif tiga sistem tidak mengetahui record mana yang hasil tebakan dan record mana yang fakta, sehingga tidak ada dasar untuk memilih apa yang perlu dilihat manusia. Setiap baris tampil dengan otoritas yang sama persis \\u2014 dan itulah masalahnya.\"\n        : \"Dataset A tidak dapat memisahkan \\u201ctidak punya skill\\u201d dari \\u201cdatanya tidak diisi\\u201d. Keduanya muncul sebagai field kosong, keduanya menghasilkan skor gap 1,00, dan keduanya masuk ke peringkat yang sama. Bucket ini hanya bisa ada setelah lapis kontekstualisasi melekatkan provenance pada setiap klaim.\",\n      absentCta: s.ds === \"A\" ? \"Alihkan ke Dataset B untuk melihat layar ini \\u2192\" : \"\",\n      isPerson: !s.loading && s.screen === \"person\",\n      isBranches: !s.loading && s.screen === \"branches\",\n      pickA: () => this.setState({ ds: \"A\" }),\n      pickB: () => this.setState({ ds: \"B\" }),\n      dsIsA: s.ds === \"A\",\n      dsIsB: s.ds === \"B\",\n      dsNote: s.ds === \"A\" ? \"Union naif tiga sistem. Title mentah, skill apa adanya, tanpa resolusi identitas.\" : \"Satu baris per orang. Title kanonik, skill berprovenance, identitas ter-resolve.\",\n      back: () => this.setState({ screen: s.from || \"queue\", person: null }),\n      toastVisible: !!s.toast,\n      toastText: s.toast || \"\"\n    };\n\n    if (s.loading) {\n      v.nav = [];\n      return v;\n    }\n\n    const groups = s.ds === \"A\" ? this.groupsA : this.groupsB;\n    const activeFlagged = this.flagged.filter(r => !s.reviewed[r.person_id]);\n\n    v.nav = [\n      { label: \"Antrean Keputusan\", count: String(groups.length), go: () => this.go(\"queue\"), style: s.screen === \"queue\" ? navOn : navBase, current: s.screen === \"queue\" ? \"page\" : undefined },\n      { label: \"Butuh Data\", count: s.ds === \"B\" ? String(this.needsData.length) : \"\\u2014\", go: () => this.go(\"needs\"), style: s.screen === \"needs\" ? navOn : navBase, current: s.screen === \"needs\" ? \"page\" : undefined },\n      { label: \"Antrean Review\", count: s.ds === \"B\" ? String(activeFlagged.length) : \"\\u2014\", go: () => this.go(\"review\"), style: s.screen === \"review\" ? navOn : navBase, current: s.screen === \"review\" ? \"page\" : undefined },\n      { label: \"Cermin Data\", count: String(this.branches.length), go: () => this.go(\"branches\"), style: s.screen === \"branches\" ? navOn : navBase, current: s.screen === \"branches\" ? \"page\" : undefined }\n    ];\n\n    // ---- queue ----\n    const crit = groups.filter(g => g.gap >= 0.85).length;\n    v.queueHeadline = s.ds === \"A\"\n      ? \"Bulan ini \" + groups.length + \" tim punya gap. \" + crit + \" tampak kritis \\u2014 dan sistem tidak tahu mana yang nyata.\"\n      : \"Bulan ini \" + groups.length + \" tim punya gap terukur. \" + crit + \" butuh keputusan minggu ini.\";\n    v.queueMethod = s.ds === \"A\"\n      ? \"Dikelompokkan dari string title mentah HRIS. Gap = 1 \\u2212 (rata-rata skill tercatat \\u00f7 4). Record kosong tidak dapat dibedakan dari skill yang benar-benar tidak dimiliki.\"\n      : \"Dikelompokkan per peran kanonik. Gap = 1 \\u2212 cakupan skill wajib peran. Tim yang mayoritas anggotanya tanpa sinyal dipindahkan ke bucket Butuh Data.\";\n\n    v.queueRows = groups.slice(0, 12).map((g, i) => {\n      const req = this.reqByCode[g.code] || [];\n      let missing = \"\\u2014\";\n      if (s.ds === \"B\" && g.people) {\n        const have = {};\n        g.people.forEach(p => splitList(p.skills_declared).concat(splitList(p.skills_evidenced)).forEach(k => have[k] = 1));\n        const miss = req.filter(r => !have[r]);\n        missing = miss.length ? miss.slice(0, 2).join(\", \") : \"Cakupan parsial\";\n      } else {\n        missing = \"Tidak dapat ditentukan\";\n      }\n      const complete = s.ds === \"B\" ? (g.signalRatio >= 0.8 ? \"Lengkap\" : \"Perlu konfirmasi\") : \"Tidak diketahui\";\n      const gapStyle = g.gap >= 0.85\n        ? \"font-variant-numeric:tabular-nums;font-weight:600;color:var(--color-accent-800)\"\n        : (g.gap >= 0.5\n          ? \"font-variant-numeric:tabular-nums;color:var(--color-accent-600)\"\n          : \"font-variant-numeric:tabular-nums;color:var(--color-neutral-500)\");\n      return {\n        rank: String(i + 1),\n        branch: g.branch,\n        role: s.ds === \"A\" ? g.role : g.role,\n        gapSkills: missing,\n        headcount: String(g.headcount),\n        gapText: num(g.gap),\n        gapStyle: gapStyle,\n        action: this.actionFor(g),\n        badge: complete,\n        badgeClass: complete === \"Lengkap\" ? \"tag tag-neutral\" : (complete === \"Perlu konfirmasi\" ? \"tag tag-accent\" : \"tag tag-outline\"),\n        open: () => { if (s.ds === \"B\" && g.people && g.people.length) this.openPerson(g.people[0].person_id); },\n        key: keyOpen(() => { if (s.ds === \"B\" && g.people && g.people.length) this.openPerson(g.people[0].person_id); })\n      };\n    });\n\n    v.queueLegend = s.ds === \"A\"\n      ? [\n          { value: String(this.groupsA.length), label: \"Grup terbentuk\" },\n          { value: \"70\", label: \"Title mentah\" },\n          { value: String(this.lowInTopA), label: \"Dari 10 teratas, cabang adopsi rendah\" },\n          { value: \"\\u2014\", label: \"Antrean review\" }\n        ]\n      : [\n          { value: String(this.groupsB.length), label: \"Tim dinilai\" },\n          { value: String(this.needsData.length), label: \"Tim butuh data\" },\n          { value: String(this.lowInTopB), label: \"Dari 10 teratas, cabang adopsi rendah\" },\n          { value: String(this.flagged.length), label: \"Antrean review\" }\n        ];\n\n    v.diffText = s.ds === \"A\"\n      ? \"Peringkat ini dibentuk dari string title mentah, sehingga \" + this.groupsA.length + \" grup terbentuk dari 200 orang. Tim di puncak adalah tim yang record skill-nya kosong, dan \" + this.lowInTopA + \" dari 10 teratas berasal dari cabang beradopsi HRIS rendah. Alihkan ke Dataset B untuk melihat siapa yang sebenarnya punya gap.\"\n      : \"Hanya \" + this.overlap + \" dari 5 tim teratas yang sama dengan peringkat Dataset A. Cabang beradopsi rendah turun dari \" + this.lowInTopA + \" menjadi \" + this.lowInTopB + \" di 10 teratas. Selisih itu bukan perbedaan angka, melainkan perbedaan siapa yang akan menerima anggaran pelatihan.\";\n\n    // ---- needs data ----\n    const needPeople = this.flagged.filter(r => splitList(r.review_reason).includes(\"skill_no_signal\")).length;\n    v.needsHeadline = this.needsData.length + \" tim belum dapat dinilai. \" + needPeople + \" orang tidak punya sinyal skill sama sekali.\";\n    v.needsNote = \"Tim di sini tidak diberi peringkat gap. Memberi mereka skor berarti menyamakan \\u201ctidak punya skill\\u201d dengan \\u201cdatanya tidak diisi\\u201d, dan itu persis kesalahan yang membuat Dataset A menyesatkan. Aksinya berbeda: melengkapi record, bukan mengirim orang ke pelatihan.\";\n    v.needsRows = this.needsData.map(g => {\n      const req = this.reqByCode[g.code] || [];\n      return {\n        branch: g.branch, role: g.role,\n        headcount: String(g.headcount),\n        signal: Math.round(g.signalRatio * g.headcount) + \" dari \" + g.headcount,\n        missing: req.length + \" skill wajib peran\",\n        cta: \"Lengkapi record \\u2192\",\n        open: () => { if (g.people && g.people.length) this.openPerson(g.people[0].person_id); },\n        key: keyOpen(() => { if (g.people && g.people.length) this.openPerson(g.people[0].person_id); })\n      };\n    });\n\n    // ---- review ----\n    const keys = Object.keys(REASON_LABEL);\n    const rcActive = {};\n    activeFlagged.forEach(r => splitList(r.review_reason).forEach(x => rcActive[x] = (rcActive[x] || 0) + 1));\n    v.triggers = keys.map(k => ({\n      count: String(rcActive[k] || 0),\n      label: REASON_LABEL[k],\n      pick: () => this.setState({ trigger: s.trigger === k ? null : k }),\n      on: s.trigger === k ? \"true\" : \"false\",\n      style: \"background:transparent;font:inherit;color:inherit;cursor:pointer;align-items:flex-start;gap:var(--space-2)\" + (s.trigger === k ? \";border-color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)\" : \"\")\n    }));\n    const list = s.trigger ? activeFlagged.filter(r => splitList(r.review_reason).includes(s.trigger)) : activeFlagged;\n    v.reviewHeadline = this.flagged.length + \" dari 232 record ditandai untuk review \\u2014 \" + num(this.flagged.length / 232 * 100, 1) + \" persen.\";\n    const reviewedCount = this.flagged.length - activeFlagged.length;\n    v.reviewProgress = reviewedCount > 0\n      ? reviewedCount + \" ditinjau sesi ini, \" + activeFlagged.length + \" tersisa.\"\n      : activeFlagged.length + \" menunggu tindakan.\";\n    v.reviewRows = list.slice(0, 14).map(r => {\n      const dqVal = r.data_quality_score;\n      const dqStyle = dqVal < 0.5\n        ? \"font-variant-numeric:tabular-nums;font-weight:600;color:var(--color-accent-800)\"\n        : (dqVal < 0.75\n          ? \"font-variant-numeric:tabular-nums;color:var(--color-accent-600)\"\n          : \"font-variant-numeric:tabular-nums;color:var(--color-neutral-500)\");\n      return {\n        name: r.resolved_name, branch: r.branch || \"Cabang tidak diketahui\",\n        role: r.canonical_title,\n        tier: TIER_LABEL[r.identity_tier] || r.identity_tier,\n        dq: num(dqVal),\n        dqStyle: dqStyle,\n        reason: splitList(r.review_reason).map(x => REASON_LABEL[x] || x).join(\"; \"),\n        cta: \"Tinjau \\u2192\",\n        open: () => this.openPerson(r.person_id),\n        key: keyOpen(() => this.openPerson(r.person_id)),\n        markDone: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.markReviewed(r.person_id, r.resolved_name); }\n      };\n    });\n    v.reviewFooter = \"Menampilkan \" + Math.min(14, list.length) + \" dari \" + list.length + \" record\" + (s.trigger ? \" pada trigger terpilih\" : \"\") + \". Antrean diurutkan berdasarkan dampak keputusan, bukan tanggal, sehingga cabang yang hanya sanggup mengerjakan sebagian tetap mengerjakan bagian yang penting.\";\n\n    // ---- person ----\n    const p = s.person ? this.byId[s.person] : null;\n    if (p) {\n      const au = this.auditById[p.person_id] || {};\n      const req = this.reqByCode[p.canonical_role_code] || [];\n      v.personName = p.resolved_name;\n      v.personRole = p.canonical_title + \" \\u00b7 \" + (p.branch || \"Cabang tidak diketahui\");\n      v.personStats = [\n        { value: num(p.data_quality_score), label: \"Skor kualitas data\" },\n        { value: num(p.identity_confidence), label: \"Confidence identitas\" },\n        { value: num(p.role_confidence), label: \"Confidence peran\" },\n        { value: p.required_skill_covered + \"/\" + p.required_skill_count, label: \"Skill wajib tertutup\" }\n      ];\n      const rows = [];\n      splitList(p.skills_declared).forEach(k => rows.push({ name: k, status: \"declared\", conf: \"1,00\", source: \"Field skill HRIS\", badgeClass: \"tag tag-neutral\" }));\n      splitList(p.skills_evidenced).forEach(k => rows.push({ name: k, status: \"evidenced\", conf: \"0,90\", source: \"Completion kursus LMS Moodle\", badgeClass: \"tag tag-accent\" }));\n      splitList(p.skills_inferred).forEach(k => rows.push({ name: k, status: \"inferred\", conf: \"0,55\", source: \"Skill wajib peran, ada sinyal lain\", badgeClass: \"tag tag-accent\" }));\n      const known = {}; rows.forEach(r => known[r.name] = 1);\n      req.filter(r => !known[r]).forEach(k => rows.push({ name: k, status: \"unknown\", conf: \"0,00\", source: \"Tidak ada sinyal. Tidak diimputasi\", badgeClass: \"tag tag-outline\" }));\n      v.personSkills = rows;\n      v.personAudit = [\n        { k: \"Person ID\", v: p.person_id },\n        { k: \"Tier resolusi\", v: (TIER_LABEL[p.identity_tier] || p.identity_tier) + \" \\u00b7 confidence \" + num(p.identity_confidence) },\n        { k: \"Record sumber\", v: p.source_record_ids },\n        { k: \"Sistem sumber\", v: p.source_systems },\n        { k: \"Varian nama teramati\", v: au.name_variants_observed || p.resolved_name },\n        { k: \"Title mentah teramati\", v: p.source_titles_seen || \"\\u2014\" },\n        { k: \"Metode pemetaan peran\", v: p.role_match_method },\n        { k: \"Tanggal masuk final\", v: p.hire_date_final + (p.hire_date_conflict === \"Y\" ? \"  \\u00b7  konflik di dalam HRIS\" : \"\") },\n        { k: \"Ter-link payroll\", v: \"Tidak \\u2014 Oracle diblok Legal\" },\n        { k: \"Status review\", v: p.review_flag === \"Y\" ? splitList(p.review_reason).map(x => REASON_LABEL[x] || x).join(\"; \") : \"Disetujui otomatis\" }\n      ];\n    } else {\n      v.personName = \"\"; v.personRole = \"\"; v.personStats = []; v.personSkills = []; v.personAudit = [];\n    }\n\n    // ---- branches ----\n    const low = this.branches.filter(b => b.rate < 0.2).length;\n    v.branchHeadline = low + \" cabang mencatat kurang dari seperlima record skill karyawannya.\";\n    v.branchRows = this.branches.map(b => ({\n      name: b.name,\n      tier: TIER_ID[TIER[b.name]] || \"\\u2014\",\n      ratio: b.f + \" dari \" + b.n,\n      rate: num(b.rate),\n      barStyle: \"position:absolute;inset:0 auto 0 0;width:\" + (b.rate * 100).toFixed(1) + \"%;background:var(--color-accent);opacity:0.55\"\n    }));\n\n    return v;\n  }\n}\n<\/script>\n\n\n</body></html>"</script>
