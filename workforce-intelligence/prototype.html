<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medika Nusantara · Workforce Intelligence Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF7EF;
  --sidebar: #17241C;
  --text: #17241C;
  --text-muted: #64746A;
  --accent: #3F9C63;
  --accent-hover: #348453;
  --accent-light: #EAF6EE;
  --gold: #E0AF2C;
  --gold-light: #FCF6E5;
  --danger: #E74C3C;
  --danger-light: #FDEEED;
  --white: #FFFFFF;
  --border: rgba(23, 36, 28, 0.1);
  --border-strong: rgba(23, 36, 28, 0.18);
  
  --font-display: 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-body);
  color: var(--text);
  background-color: var(--bg);
  height: 100vh;
  display: flex;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
aside {
  width: 290px;
  background-color: var(--sidebar);
  color: var(--white);
  padding: 32px 20px;
  display: flex;
  flex-direction: column;
  height: 100%;
  flex-shrink: 0;
  overflow-y: auto;
  border-right: 1px solid rgba(255,255,255,0.06);
}

.logo-area {
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.logo-text {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 23px;
  letter-spacing: -0.8px;
  color: var(--white);
  display: flex;
  align-items: center;
  gap: 2px;
}

.logo-text span {
  color: var(--accent);
}

.logo-sub {
  font-size: 10.5px;
  opacity: 0.6;
  font-weight: 500;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 3px;
}

.nav-group {
  margin-bottom: 28px;
}

.nav-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: rgba(255,255,255,0.45);
  margin-bottom: 12px;
  font-weight: 600;
}

/* Dataset Toggle Widget */
.data-engine-card {
  background: rgba(255,255,255,0.06);
  padding: 14px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
}

.engine-toggle {
  display: flex;
  background: rgba(0,0,0,0.25);
  padding: 3px;
  border-radius: 8px;
  margin-bottom: 10px;
  border: 1px solid rgba(255,255,255,0.05);
}

.engine-toggle button {
  flex: 1;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 600;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.6);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-body);
}

.engine-toggle button.active {
  background: var(--accent);
  color: var(--white);
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.engine-meta {
  font-size: 11px;
  line-height: 1.45;
  color: rgba(255,255,255,0.7);
  margin-bottom: 10px;
}

.engine-bar-bg {
  height: 5px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  width: 100%;
  overflow: hidden;
}

.engine-bar-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 3px;
  transition: width 0.3s ease;
}

/* Nav buttons */
.nav-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 11px 14px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.75);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: 9px;
  margin-bottom: 4px;
  transition: all 0.18s ease;
  font-family: var(--font-body);
  text-align: left;
}

.nav-btn:hover {
  background: rgba(255,255,255,0.07);
  color: var(--white);
}

.nav-btn.active {
  background: var(--accent);
  color: var(--white);
  font-weight: 600;
  box-shadow: 0 4px 14px rgba(63, 156, 99, 0.35);
}

.badge {
  font-size: 11px;
  font-weight: 600;
  background: rgba(255,255,255,0.16);
  padding: 2px 8px;
  border-radius: 20px;
  font-variant-numeric: tabular-nums;
}

.nav-btn.active .badge {
  background: rgba(0,0,0,0.22);
  color: var(--white);
}

.sidebar-footer {
  margin-top: auto;
  padding-top: 20px;
  border-top: 1px solid rgba(255,255,255,0.08);
  font-size: 10.5px;
  line-height: 1.6;
  color: rgba(255,255,255,0.45);
}

/* Main Content */
main {
  flex: 1;
  padding: 44px 56px;
  overflow-y: auto;
  position: relative;
  max-width: 1400px;
}

.header-meta {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}

h1 {
  font-family: var(--font-display);
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -1.2px;
  margin-bottom: 8px;
  color: var(--text);
  line-height: 1.2;
}

.header-desc {
  font-size: 14.5px;
  color: var(--text-muted);
  line-height: 1.6;
  margin-bottom: 28px;
  max-width: 820px;
}

/* Metric Cards */
.card-container {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 36px;
}

.card-container.grid-4 {
  grid-template-columns: repeat(4, 1fr);
}

.glass-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 24px 26px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.02);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.glass-card:hover {
  box-shadow: 0 12px 36px rgba(0,0,0,0.04);
}

.card-val {
  font-family: var(--font-display);
  font-size: 42px;
  font-weight: 400;
  margin-bottom: 6px;
  line-height: 1.1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.card-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 4px;
}

.card-desc {
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.5;
}

/* Filter Bar & Controls */
.controls-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.search-input {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--white);
  font-size: 13.5px;
  font-family: var(--font-body);
  color: var(--text);
  width: 280px;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}

/* Trigger Filter Buttons for Review View */
.trigger-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

.trigger-card {
  background: var(--white);
  border: 1px solid var(--border);
  padding: 16px 14px;
  border-radius: 12px;
  cursor: pointer;
  text-align: left;
  transition: all 0.18s ease;
}

.trigger-card:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}

.trigger-card.active {
  border-color: var(--accent);
  background: var(--accent-light);
  box-shadow: 0 0 0 2px var(--accent);
}

.trigger-count {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}

.trigger-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
}

/* Data Table */
.table-wrapper {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.02);
  margin-bottom: 32px;
}

.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}

.data-table th {
  padding: 16px 20px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
  background: rgba(250, 247, 239, 0.4);
}

.data-table td {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
  vertical-align: middle;
}

.data-table tr:last-child td {
  border-bottom: none;
}

.data-table tbody tr.clickable-row {
  cursor: pointer;
  transition: background 0.15s ease;
}

.data-table tbody tr.clickable-row:hover {
  background: var(--accent-light);
}

/* Gap fill bar */
.gap-fill {
  height: 8px;
  background: rgba(23, 36, 28, 0.08);
  border-radius: 4px;
  width: 100px;
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}

.gap-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  border-radius: 4px;
  background: var(--accent);
}

.gap-bar.danger {
  background: var(--danger);
}

.gap-bar.gold {
  background: var(--gold);
}

/* Status Indicators */
.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}

.status-high { background: var(--gold); }
.status-full { background: var(--danger); }
.status-ok { background: var(--accent); }

.tag-pill {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 600;
}

.tag-pill.pill-ok {
  background: var(--accent-light);
  color: var(--accent-hover);
}

.tag-pill.pill-warn {
  background: var(--gold-light);
  color: #B5840D;
}

.tag-pill.pill-neutral {
  background: rgba(23, 36, 28, 0.06);
  color: var(--text-muted);
}

.tag-pill.pill-danger {
  background: var(--danger-light);
  color: var(--danger);
}

/* Action Button */
.btn-action {
  background: var(--accent-light);
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-body);
}

.btn-action:hover {
  background: var(--accent);
  color: var(--white);
}

.btn-resolve {
  background: var(--accent);
  color: var(--white);
  border: none;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
  margin-left: 6px;
}

.btn-resolve:hover {
  opacity: 0.9;
}

/* Footer / Context Box */
.footer-info {
  margin-top: 36px;
  background: var(--accent-light);
  padding: 24px 28px;
  border-radius: 16px;
  border: 1px dashed var(--accent);
  font-size: 13.5px;
  line-height: 1.65;
  color: var(--text);
}

.footer-info b {
  color: var(--accent-hover);
}

/* Back Button */
.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--white);
  border: 1px solid var(--border);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  margin-bottom: 20px;
  transition: all 0.2s ease;
}

.btn-back:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--sidebar);
  color: var(--white);
  padding: 14px 22px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  font-size: 13.5px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 1000;
  animation: slideUp 0.25s ease-out;
  border-left: 4px solid var(--accent);
}

@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@media (max-width: 1100px) {
  .card-container { grid-template-columns: 1fr; }
  .card-container.grid-4 { grid-template-columns: repeat(2, 1fr); }
  .trigger-grid { grid-template-columns: repeat(2, 1fr); }
  main { padding: 30px 24px; }
}
</style>

<script>
const CANON_BRANCH = ["Jakarta Pusat","Bekasi","Bandung","Surabaya","Semarang","Yogyakarta","Medan","Palembang","Makassar","Balikpapan","Denpasar","Manado"];
const TIER = {"Jakarta Pusat":"high","Bekasi":"high","Bandung":"high","Surabaya":"mid","Semarang":"mid","Yogyakarta":"mid","Medan":"mid","Denpasar":"mid","Palembang":"low","Makassar":"low","Balikpapan":"low","Manado":"low"};
const TIER_ID = {high:"Tinggi", mid:"Menengah", low:"Rendah"};
const REASON_LABEL = {
  identity_probabilistic_or_orphan: "Identitas probabilistik / orphan",
  hire_date_conflict_within_hris: "Konflik tanggal masuk HRIS",
  status_conflict_possible_transfer: "Konflik status (indikasi mutasi)",
  skill_no_signal: "Tidak ada sinyal skill",
  title_unmapped_or_fuzzy: "Title tidak terpetakan"
};
const TIER_LABEL = {
  T1_email: "T1 (Email)", T1_nik: "T1 (NIK)", T2_name_dob: "T2 (Nama+DOB)",
  T3a_fuzzy_high: "T3a (Fuzzy Tinggi)", T3b_fuzzy_mid: "T3b (Fuzzy Sedang)", T4_single_hris: "T4 (HRIS Saja)", T4_orphan: "T4 (Orphan)"
};

let RAW_A = [];
let RAW_B = [];
let TAXONOMY = { roles: {} };
let AUDIT_LOGS = [];
let COMPARISON = {};

let currentDataset = 'B';
let currentView = 'queue';
let selectedTrigger = null;
let currentPersonId = null;
let searchQuery = '';
let reviewedRecords = {};

let groupsA = [];
let groupsB = [];
let needsDataB = [];
let branchesList = [];
let flaggedRecords = [];
let auditById = {};
let personById = {};
let reqByCode = {};

function canonBranch(b) {
  const t = (b || "").trim();
  const hit = CANON_BRANCH.find(c => c.toLowerCase() === t.toLowerCase());
  return hit || t;
}

function splitList(s) {
  return (s || "").split(";").map(x => x.trim()).filter(Boolean);
}

async function loadData() {
  try {
    const [resA, resB, resTax, resAuditTxt, resMetrics] = await Promise.all([
      fetch('data/dataset_a_messy.json').then(r => r.json()),
      fetch('data/dataset_b_clean.json').then(r => r.json()),
      fetch('data/role_taxonomy.json').then(r => r.json()),
      fetch('data/resolution_audit.csv').then(r => r.text()),
      fetch('data/comparison_metrics.json').then(r => r.json())
    ]);

    RAW_A = resA;
    RAW_B = resB;
    TAXONOMY = resTax;
    COMPARISON = resMetrics;

    const lines = resAuditTxt.trim().split('\n');
    const headers = lines[0].split(',');
    AUDIT_LOGS = lines.slice(1).map(line => {
      const cells = [];
      let cur = '', inQuotes = false;
      for (const ch of line) {
        if (ch === '"') inQuotes = !inQuotes;
        else if (ch === ',' && !inQuotes) { cells.push(cur); cur = ''; }
        else cur += ch;
      }
      cells.push(cur);
      const obj = {};
      headers.forEach((h, idx) => obj[h.trim()] = (cells[idx] || '').trim());
      return obj;
    });

    initCalculations();
    updateBadges();
    render();
  } catch (err) {
    console.error("Failed to load datasets:", err);
    document.getElementById('app-main').innerHTML = '<div style="padding:40px; color:var(--danger)">Gagal memuat dataset: ' + err.message + '</div>';
  }
}

function initCalculations() {
  Object.keys(TAXONOMY.roles).forEach(code => {
    reqByCode[code] = TAXONOMY.roles[code].required_skills;
  });

  AUDIT_LOGS.forEach(a => { auditById[a.person_id] = a; });
  RAW_B.forEach(b => { personById[b.person_id] = b; });
  flaggedRecords = RAW_B.filter(r => r.review_flag === 'Y');

  // Groups A (Naive Union based on raw job titles)
  const empA = RAW_A.filter(r => r.source_system === "HRIS_SuccessFactors" && r.raw_job_title && !r.record_notes);
  const ga = {};
  empA.forEach(r => {
    const br = canonBranch(r.branch);
    const t = (r.raw_job_title || "").replace(/\s+/g, " ").trim();
    const k = br + "|" + t.toLowerCase();
    if (!ga[k]) ga[k] = { branch: br, title: t, n: 0, skills: 0 };
    ga[k].n++;
    ga[k].skills += splitList(r.skills_raw).length;
  });
  groupsA = Object.values(ga).map(g => {
    const avg = g.skills / g.n;
    return {
      branch: g.branch,
      role: g.title,
      headcount: g.n,
      gap: 1 - Math.min(1, avg / 4),
      avgSkills: avg
    };
  }).filter(g => g.headcount >= 2).sort((x, y) => y.gap - x.gap || y.headcount - x.headcount);

  // Groups B (Resolved canonical roles)
  const gb = {};
  RAW_B.forEach(r => {
    const br = canonBranch(r.branch);
    if (!br) return;
    const k = br + "|" + r.canonical_role_code;
    if (!gb[k]) gb[k] = { branch: br, code: r.canonical_role_code, title: r.canonical_title, n: 0, cov: 0, req: 0, sig: 0, people: [] };
    const g = gb[k];
    g.n++;
    g.cov += (r.required_skill_covered || 0);
    g.req += (r.required_skill_count || 0);
    if (splitList(r.skills_declared).length || splitList(r.skills_evidenced).length || splitList(r.skills_inferred).length) {
      g.sig++;
    }
    g.people.push(r);
  });
  const allB = Object.values(gb).filter(g => g.n >= 2).map(g => {
    const coverage = g.req ? g.cov / g.req : 0;
    return {
      branch: g.branch,
      role: g.title,
      code: g.code,
      headcount: g.n,
      gap: 1 - coverage,
      coverage,
      signalRatio: g.sig / g.n,
      people: g.people
    };
  });
  groupsB = allB.filter(g => g.signalRatio >= 0.5).sort((x, y) => y.gap - x.gap || y.headcount - x.headcount);
  needsDataB = allB.filter(g => g.signalRatio < 0.5).sort((x, y) => x.signalRatio - y.signalRatio || y.headcount - x.headcount);

  // Branch fill rates
  const bf = {};
  empA.forEach(r => {
    const br = canonBranch(r.branch);
    if (!br) return;
    if (!bf[br]) bf[br] = { n: 0, f: 0 };
    bf[br].n++;
    if (r.skills_raw) bf[br].f++;
  });
  branchesList = Object.keys(bf).map(k => ({
    name: k,
    tier: TIER_ID[TIER[k]] || "Menengah",
    n: bf[k].n,
    f: bf[k].f,
    rate: bf[k].f / bf[k].n
  })).sort((x, y) => y.rate - x.rate);
}

function updateBadges() {
  const activeGroups = currentDataset === 'A' ? groupsA : groupsB;
  document.getElementById('badge-queue').innerText = activeGroups.length;
  document.getElementById('badge-needs').innerText = currentDataset === 'B' ? needsDataB.length : '—';
  
  const remainingReviews = flaggedRecords.filter(r => !reviewedRecords[r.person_id]).length;
  document.getElementById('badge-review').innerText = currentDataset === 'B' ? remainingReviews : '—';
  document.getElementById('badge-branches').innerText = branchesList.length;

  document.getElementById('btn-ds-a').className = currentDataset === 'A' ? 'active' : '';
  document.getElementById('btn-ds-b').className = currentDataset === 'B' ? 'active' : '';
  
  const statusEl = document.getElementById('engine-status-text');
  const barEl = document.getElementById('engine-bar');
  if (currentDataset === 'A') {
    statusEl.innerHTML = 'Dataset Aktif: <b>Dataset A (Raw)</b><br>Data mentah tanpa resolusi identitas.';
    barEl.style.width = '35%';
    barEl.style.background = '#E74C3C';
  } else {
    statusEl.innerHTML = 'Dataset Aktif: <b>Dataset B (Resolved)</b><br>Identitas terpetakan 1 baris per orang.';
    barEl.style.width = '85%';
    barEl.style.background = 'var(--gold)';
  }
}

function setDataset(ds) {
  if (currentDataset === ds) return;
  currentDataset = ds;
  updateBadges();
  showToast('Beralih ke Dataset ' + ds + (ds === 'B' ? ' (Ter-resolve & Confidence-scored)' : ' (Union Mentah Tiga Sistem)'));
  render();
}

function switchView(view) {
  currentView = view;
  currentPersonId = null;
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const activeBtn = document.getElementById('nav-' + view);
  if (activeBtn) activeBtn.classList.add('active');
  render();
}

function showPerson(id) {
  currentPersonId = id;
  currentView = 'person';
  render();
}

function markReviewed(id, name, event) {
  if (event) event.stopPropagation();
  reviewedRecords[id] = true;
  updateBadges();
  showToast('Record ' + name + ' ditandai selesai ditinjau.');
  render();
}

function showToast(msg) {
  const box = document.getElementById('toast-box');
  box.innerHTML = '<div class="toast"><span style="color:var(--accent); font-size:16px;">✓</span> ' + msg + '</div>';
  setTimeout(() => { box.innerHTML = ''; }, 3500);
}

function render() {
  const main = document.getElementById('app-main');

  if (currentView === 'queue') {
    renderQueue(main);
  } else if (currentView === 'needs') {
    renderNeeds(main);
  } else if (currentView === 'review') {
    renderReview(main);
  } else if (currentView === 'branches') {
    renderBranches(main);
  } else if (currentView === 'person') {
    renderPerson(main);
  }
}

        <div class="card-desc">Tingkat integritas catatan identitas & skill.</div>
      </div>
      <div class="glass-card">
        <div class="card-val">${(p.identity_confidence * 100).toFixed(0)}%</div>
        <div class="card-label">Keyakinan Identitas</div>
        <div class="card-desc">Tier: ${TIER_LABEL[p.identity_tier] || p.identity_tier}</div>
      </div>
      <div class="glass-card">
        <div class="card-val" style="color:var(--gold)">${(p.role_confidence * 100).toFixed(0)}%</div>
        <div class="card-label">Kesesuaian Peran</div>
        <div class="card-desc">Metode: ${p.role_match_method}</div>
      </div>
      <div class="glass-card">
        <div class="card-val">${p.required_skill_covered}/${p.required_skill_count}</div>
        <div class="card-label">Skill Terpenuhi</div>
        <div class="card-desc">Cakupan kompetensi wajib posisi.</div>
      </div>
    </div>

    <h2 style="font-family:var(--font-display); font-size:22px; margin-bottom:14px;">Provenance & Status Kompetensi</h2>
    <div class="table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>KOMPETENSI / SKILL</th>
            <th>STATUS KLAIM</th>
            <th>CONFIDENCE</th>
            <th>SUMBER BUKTI DATA</th>
          </tr>
        </thead>
        <tbody>
  `;

  skillsList.forEach(s => {
    html += `
      <tr>
        <td><b>${s.name}</b></td>
        <td><span class="tag-pill ${s.pill}">${s.status.toUpperCase()}</span></td>
        <td style="font-variant-numeric:tabular-nums; font-weight:600;">${s.conf}</td>
        <td style="color:var(--text-muted); font-size:12.5px;">${s.source}</td>
      </tr>
    `;
  });

  html += `
        </tbody>
      </table>
    </div>

    <h2 style="font-family:var(--font-display); font-size:22px; margin-top:36px; margin-bottom:14px;">Jejak Audit Resolusi Identitas</h2>
    <div class="table-wrapper">
      <table class="data-table">
        <tbody>
          <tr><td style="width:240px; color:var(--text-muted);">Tier Resolusi Identitas</td><td><b>${TIER_LABEL[p.identity_tier] || p.identity_tier}</b> (Tingkat Keyakinan: ${(p.identity_confidence * 100).toFixed(0)}%)</td></tr>
          <tr><td style="color:var(--text-muted);">ID Record Sumber</td><td><code>${p.source_record_ids}</code></td></tr>
          <tr><td style="color:var(--text-muted);">Sistem Asal Data</td><td>${p.source_systems.replace(/,/g, ', ')}</td></tr>
          <tr><td style="color:var(--text-muted);">Variasi Nama Terdeteksi</td><td>${au.name_variants_observed || p.resolved_name}</td></tr>
          <tr><td style="color:var(--text-muted);">Title Mentah di Sistem</td><td>${p.source_titles_seen || '—'}</td></tr>
          <tr><td style="color:var(--text-muted);">Tanggal Masuk Final</td><td>${p.hire_date_final} ${p.hire_date_conflict === 'Y' ? '<span class="tag-pill pill-warn" style="margin-left:8px;">Konflik Tanggal di HRIS</span>' : ''}</td></tr>
          <tr><td style="color:var(--text-muted);">Status Integrasi Payroll</td><td><span class="tag-pill pill-neutral">Tidak Terhubung (Oracle Diblok Legal)</span></td></tr>
          <tr><td style="color:var(--text-muted);">Status Review Manajemen</td><td>${p.review_flag === 'Y' ? '<span class="tag-pill pill-warn">Perlu Verifikasi: ' + splitList(p.review_reason).map(x => REASON_LABEL[x] || x).join('; ') + '</span>' : '<span class="tag-pill pill-ok">Disetujui Otomatis (Auto-merged)</span>'}</td></tr>
        </tbody>
      </table>
    </div>
  `;

  main.innerHTML = html;
}

// Kick off data load on startup
loadData();
</script>

</body>
</html>
